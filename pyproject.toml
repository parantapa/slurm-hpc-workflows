[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-workflows"
dynamic = ["version"]
authors = [
  { name="Parantapa Bhattacharya", email="parantapa@virginia.edu" },
]
description = "HPC workflow helpers for Slurm clusters."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "click",
    "tqdm",
    "jinja2",
    "json5",
    "platformdirs",
    "cloudpickle",
    "typeguard>=3",
    "ds-service-client>=2.1.0"
]

[project.optional-dependencies]
botorch = ["botorch"]
test = ["pytest", "botorch"]
dev = ["black", "pyright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Pinned to the `requires-python` floor so formatting does not drift
# with whatever Python happens to be running black.
[tool.black]
target-version = ["py312"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.12"

[tool.setuptools_scm]
fallback_version = "1.0.0-dev"

[project.urls]
"Homepage" = "https://github.com/parantapa/slurm-hpc-workflows"

[project.scripts]
"run-jupyter" = "slurm_workflows.run_jupyter:run_jupyter"
"slurm-pilot-worker" = "slurm_workflows.slurm_pilot_worker:slurm_pilot_worker"
